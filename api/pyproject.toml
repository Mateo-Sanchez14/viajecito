[project]
name = "viajecito-api"
version = "0.1.0"
description = "viajecito backend (Django + Ninja)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-ninja>=1.7,<2",
    "gunicorn>=23",
    "whitenoise>=6.9",
    "environs>=14",
    "phonenumbers>=9.0.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-socket>=0.7",
    "ruff>=0.12",
    "import-linter>=2.3",
    "factory-boy>=3.3",
    "time-machine>=2.16",
    "respx>=0.22",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--disable-socket --allow-unix-socket -ra"
testpaths = ["tests", "ops", "shared", "identity", "crews", "messaging"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "shared", "ops", "identity", "crews", "messaging"]

[tool.importlinter]
root_packages = [
    "config", "shared", "ops", "identity", "crews", "messaging", "django", "ninja", "httpx",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared depends on no other project package"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["config", "ops", "identity", "crews", "messaging"]

[[tool.importlinter.contracts]]
name = "domain, use cases and ports import no framework or HTTP code"
type = "forbidden"
source_modules = [
    "identity.domain", "identity.use_cases", "identity.ports",
    "crews.domain", "crews.use_cases", "crews.ports",
    "messaging.use_cases", "messaging.ports",
    "shared.phone", "shared.clock",
]
forbidden_modules = ["django", "ninja", "httpx"]

[[tool.importlinter.contracts]]
name = "messaging reaches other apps only through their use cases"
type = "forbidden"
source_modules = ["messaging"]
forbidden_modules = [
    "identity.models", "identity.domain", "identity.ports", "identity.adapters", "identity.api",
    "identity.schemas", "crews.models", "crews.domain", "crews.ports", "crews.adapters",
    "crews.api", "crews.schemas",
]

[[tool.importlinter.contracts]]
name = "crews does not depend on identity or messaging"
type = "forbidden"
source_modules = ["crews"]
forbidden_modules = ["identity", "messaging"]
ignore_imports = ["crews.tests.* -> identity.models"]  # tests create the user model
