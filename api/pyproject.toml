    "crews.api", "crews.schemas",
    "trips.models", "trips.domain", "trips.ports", "trips.adapters", "trips.api",
    "trips.schemas",
    "messaging.models", "messaging.domain", "messaging.ports", "messaging.adapters",
    "messaging.api", "messaging.schemas",
]
allow_indirect_imports = true
# Tests create their rows through the other apps' models.
ignore_imports = [
    "ski.tests.* -> crews.models",
    "ski.tests.* -> identity.models",
    "ski.tests.* -> trips.models",
    "ski.tests.* -> messaging.domain",
]

[[tool.importlinter.contracts]]
name = "decisions reaches other apps only through their use cases"
type = "forbidden"
source_modules = ["decisions"]
forbidden_modules = [
    "identity.models", "identity.domain", "identity.ports", "identity.adapters", "identity.api",
    "identity.schemas", "crews.models", "crews.domain", "crews.ports", "crews.adapters",
    "crews.schemas",
    "trips.models", "trips.domain", "trips.ports", "trips.adapters", "trips.schemas",
    "messaging.models", "messaging.adapters", "messaging.ports", "messaging.domain",
    "messaging.use_cases",
]
allow_indirect_imports = true
# ``crews.api_auth`` / ``trips.api_auth`` are the published authorization helpers; tests create
# core rows and the gateway adapters are decisions' single bridge to the trips/crews use cases.
ignore_imports = [
    "decisions.tests.* -> crews.models",
    "decisions.tests.* -> identity.models",
    "decisions.tests.* -> trips.models",
    "decisions.tests.* -> messaging.domain",
    "decisions.tests.* -> messaging.models",
]

[[tool.importlinter.contracts]]
name = "linkpreview is independent of the other milestone apps"
type = "forbidden"
source_modules = ["linkpreview"]
forbidden_modules = ["proposals"]

[[tool.importlinter.contracts]]
name = "proposals reaches linkpreview and core apps only through use cases"
type = "forbidden"
source_modules = ["proposals"]
forbidden_modules = [
    "linkpreview.models", "linkpreview.ports", "linkpreview.adapters", "linkpreview.api",
    "linkpreview.schemas",
    "identity.models", "identity.ports", "identity.adapters",
    "crews.models", "crews.domain", "crews.adapters",
    "trips.models", "trips.domain", "trips.ports", "trips.adapters", "trips.schemas",
]
allow_indirect_imports = true
# Tests create rows and seed the fake fetcher; the API authorizes with the core helpers.
ignore_imports = [
    "proposals.tests.* -> identity.models",
    "proposals.tests.* -> crews.models",
    "proposals.tests.* -> trips.models",
    "proposals.tests.* -> linkpreview.models",
    "proposals.tests.* -> linkpreview.adapters.*",
    # The single typed bridge to linkpreview: maps its ``PreviewRef`` to proposals' own type.
    "proposals.adapters.previews -> linkpreview.ports",
]

