[project]
name = "viajecito-api"
version = "0.1.0"
description = "viajecito backend (Django + Ninja)"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "django-ninja>=1.7,<2",
    "gunicorn>=23",
    "whitenoise>=6.9",
    "environs>=14",
    "phonenumbers>=9.0.40",
    "httpx>=0.28",
    "selectolax>=0.3",
    "pillow>=11",
    "pywebpush>=2.5.0",
    "cryptography>=50.0.2,<51",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-socket>=0.7",
    "ruff>=0.12",
    "import-linter>=2.3",
    "factory-boy>=3.3",
    "time-machine>=2.16",
    "respx>=0.22",
    "hypothesis>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--disable-socket --allow-unix-socket -ra"
testpaths = [
    "tests",
    "ops",
    "shared",
    "identity",
    "crews",
    "messaging",
    "trips",
    "decisions",
    "notifications",
    "ski",
    "linkpreview",
    "proposals",
    "logistics",
    "documents",
    "budget",
    "itinerary",
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "shared",
    "ops",
    "identity",
    "crews",
    "messaging",
    "trips",
    "decisions",
    "notifications",
    "ski",
    "linkpreview",
    "proposals",
    "logistics",
    "documents",
    "budget",
    "itinerary",
]

[tool.importlinter]
root_packages = [
    "config",
    "shared",
    "ops",
    "identity",
    "crews",
    "messaging",
    "trips",
    "decisions",
    "notifications",
    "django",
    "ninja",
    "httpx",
    "ski",
    "linkpreview",
    "proposals",
    "logistics",
    "documents",
    "budget",
    "itinerary",
]

include_external_packages = true

[[tool.importlinter.contracts]]
name = "shared depends on no other project package"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = [
    "config", "ops", "identity", "crews", "messaging", "trips", "decisions", "notifications", "ski",
    "linkpreview",
    "proposals",
    "logistics",
    "documents",
    "budget",
    "itinerary",
]

[[tool.importlinter.contracts]]
name = "domain, use cases and ports import no framework or HTTP code"
type = "forbidden"
source_modules = [
    "identity.domain", "identity.use_cases", "identity.ports",
    "crews.domain", "crews.use_cases", "crews.ports",
    "messaging.use_cases", "messaging.ports", "messaging.domain", "messaging.router",
    "messaging.handlers",
    "trips.domain", "trips.use_cases", "trips.ports", "trips.plugins",
    "decisions.domain", "decisions.use_cases", "decisions.ports",
    "messaging.reminders",
    "shared.phone", "shared.clock", "shared.events",
    "shared.timezones",
    "linkpreview.domain", "linkpreview.use_cases", "linkpreview.ports",
    "proposals.domain", "proposals.use_cases", "proposals.ports", "proposals.copy",
    "notifications.domain",
    "notifications.use_cases",
    "notifications.ports",
    "logistics.domain", "logistics.use_cases", "logistics.ports",
    "logistics.domain_nag",
    "documents.domain", "documents.use_cases", "documents.ports",
    "budget.domain", "budget.use_cases",
    "itinerary.domain", "itinerary.use_cases", "itinerary.ports",
    "ski.domain",
    "ski.use_cases",
    "ski.ports",
]
forbidden_modules = ["django", "ninja", "httpx", "pywebpush", "requests"]

[[tool.importlinter.contracts]]
name = "messaging reaches other apps only through their use cases"
type = "forbidden"
source_modules = ["messaging"]
forbidden_modules = [
    "identity.models", "identity.domain", "identity.ports", "identity.adapters", "identity.api",
    "identity.schemas", "crews.models", "crews.domain", "crews.ports", "crews.adapters",
    "crews.api", "crews.schemas",
    "trips.models", "trips.domain", "trips.ports", "trips.adapters", "trips.api",
    "trips.schemas",
    "logistics.models",
    "logistics.domain",
    "logistics.ports",
    "logistics.adapters",
    "logistics.api",
    "logistics.schemas",
    "budget.domain",
    "budget.api",
    "budget.schemas",
    "documents.models",
    "documents.domain",
    "documents.ports",
    "documents.adapters",
    "documents.api",
    "documents.schemas",
    "itinerary.models",
    "itinerary.domain",
    "itinerary.ports",
    "itinerary.adapters",
    "itinerary.api",
    "itinerary.schemas",
]
# Only direct imports are checked: use cases legitimately reach their own domain and ports.
allow_indirect_imports = true
# The gateway adapters are messaging's single bridge to each app: they wire that app's use cases
# to its Django adapter (same shape as ``identity.adapters.crews_gateway``). Tests create rows.
ignore_imports = [
    "messaging.adapters.crews_gateway -> crews.adapters.django_store",
    "messaging.adapters.identity_gateway -> identity.adapters.django_repos",
    "messaging.tests.* -> crews.models",
    "messaging.tests.* -> identity.models",
]

[[tool.importlinter.contracts]]
name = "notifications reaches other apps only through their use cases"
type = "forbidden"
source_modules = ["notifications"]
forbidden_modules = [
    "identity.models", "identity.domain", "identity.ports", "identity.adapters", "identity.api",
    "identity.schemas", "crews.models", "crews.domain", "crews.ports", "crews.adapters",
    "crews.api", "crews.schemas",
    "trips.models", "trips.domain", "trips.ports", "trips.adapters", "trips.api", "trips.schemas",
    "messaging.models", "messaging.domain", "messaging.ports", "messaging.adapters",
    "messaging.api", "messaging.schemas", "messaging.use_cases", "messaging.handlers",
]
# Only direct imports are checked. ``messaging.reminders`` (the registries) is the allowed seam.
allow_indirect_imports = true
ignore_imports = [
    "notifications.tests.* -> crews.models",
    "notifications.tests.* -> identity.models",
    "notifications.tests.* -> trips.models",
    "notifications.tests.* -> trips.domain",
    "notifications.tests.* -> messaging.models",
]

[[tool.importlinter.contracts]]
name = "crews does not depend on identity, messaging or trips"
type = "forbidden"
source_modules = ["crews"]
forbidden_modules = ["identity", "messaging", "trips"]
ignore_imports = ["crews.tests.* -> identity.models"]  # tests create the user model

[[tool.importlinter.contracts]]
name = "trips never imports a trip-type plugin"
type = "forbidden"
source_modules = ["trips"]
forbidden_modules = ["ski"]

[[tool.importlinter.contracts]]
name = "ski reaches other apps only through their use cases"
type = "forbidden"
