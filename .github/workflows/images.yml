name: images

on:
  push:
    branches: [main]
    paths: ["api/**", "web/**", "deploy/docker/**", ".github/workflows/images.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to publish, e.g. v0.1.0 (optional; the commit sha is always published, latest only from main)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
            target: prod
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/viajecito-{1}:latest', steps.owner.outputs.value, matrix.name) || '' }}
            ghcr.io/${{ steps.owner.outputs.value }}/viajecito-${{ matrix.name }}:${{ github.sha }}
            ${{ inputs.tag != '' && format('ghcr.io/{0}/viajecito-{1}:{2}', steps.owner.outputs.value, matrix.name, inputs.tag) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
