# Development stack: Django runserver + Next dev server + a fake Gowa. Copy .env.example to .env first.
name: viajecito

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./data:/data
    env_file: .env
    environment:
      GOWA_BASE_URL: http://fake-gowa:4000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - fake-gowa

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  fake-gowa:
    build: deploy/dev/fake_gowa
    ports:
      - "4000:4000"
